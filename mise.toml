[env]
_.file = { path = ".env" }
_.path = ["{{config_root}}/node_modules/.bin", "{{cwd}}/node_modules/.bin"]

HK_MISE = 1

[settings]
experimental = true
auto_install = false
lockfile = true
provenance_api_failures_fatal = false
cargo.binstall_native = true

[tools]
"github:howmanysmall/pullhook" = "latest"
"github:vale-cli/vale-ls" = "latest"
"npm:sherif" = "latest"
actionlint = "latest"
betterleaks = "latest"
bun = "1.4.3"
communique = "latest"
direnv = "latest"
git-cliff = "latest"
hk = "2.5.0"
ni = "latest"
node = "24"
pinact = "latest"
pkl = "latest"
pnpm = "12.12.1"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
tombi = "latest"
vale = "latest"
zizmor = "latest"

[tasks]
[tasks."amend:no-verify"]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff --no-verify"

[tasks."commit:no-verify"]
description = "Commits the staged changes without running Git hooks."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}" --no-verify
"""

[tasks."fallow:audit-hk"]
description = "Runs fallow to audit the project."
depends = ["test:istanbul"]
run = "fallow audit --quiet --gate-marker hk"

[tasks."test:istanbul"]
description = "Generate a coverage report with Vitest and Istanbul."
sources = [
	"packages/**",
	"tools/**",
	"*.config.*",
	"tsconfig*.json",
	"package.json",
	"pnpm-lock.yaml",
	"pnpm-workspace.yaml",
	"!**/node_modules/**",
	"!**/dist/**",
	"!**/.cache/**",
	"!**/*.tsbuildinfo",
]
outputs = [".cache/istanbul/coverage-final.json"]
cache = { enabled = true, command_inputs = ["pwd"] }
run = """
rm -f .cache/istanbul/coverage-final.json
nr test:istanbul --silent >/dev/null 2>&1 || test -s .cache/istanbul/coverage-final.json
"""

[tasks.amend]
description = "Amends the staged changes, reusing the previous commit message."
run = "git commit --amend --reuse-message=HEAD --signoff"

[tasks.build]
description = "Bundle lsp-mux into plugins/howmanysmall-lsps/lsp-mux.js using tsdown."
run = "node --run build"

[tasks.check]
description = "Run local validation: lint, type-check, test, and build."
depends = ["lint", "type-check", "test", "build"]

[tasks.commit]
description = "Commits the staged changes."
usage = """
arg <message> {
	help "Git commit message"
}
"""
run = """
git commit --signoff --message "${usage_message?}"
"""

[tasks.dead-code]
description = "Detect unused files, exports, types, and dependencies with fallow."
run = "node --run fallow:dead-code"

[tasks.duplicates]
alias = "dupes"
description = "Detect duplicated and structurally-similar code with fallow."
run = "node --run fallow:dupes"

[tasks.health]
description = "Rank complexity hotspots and refactoring targets with fallow."
run = "node --run fallow:health"

[tasks.install]
description = "Install dependencies from the pnpm lockfile."
run = "ni"

[tasks.lint]
description = "Run the project lint pipeline: ESLint plus Biome checks via the package script."
run = "node --run lint"

[tasks.lint-configuration]
description = "View the lint configuration."
usage = '''
arg "<type>" {
	help "What linting configuration do you want to run the inspector for?"
	choices "eslint" "oxlint"
}
'''
run = '''
#!/usr/bin/env bash

set -euo pipefail

case "${usage_type?}" in
	eslint)
		nlx @eslint/config-inspector
		;;
	oxlint)
		nlx oxlint-config-inspector
		;;
esac
'''

[tasks.test]
description = "Run the Vitest unit test suite once."
run = "node --run test"

[tasks.type-check]
description = "Run TypeScript type checking without emitting files."
run = "node --run type-check"
